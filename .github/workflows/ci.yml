name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (typecheck + client bundle)
        run: npm run build

      - name: Unit & integration tests
        run: npm test

      - name: Content pack validator
        run: npm run validate
