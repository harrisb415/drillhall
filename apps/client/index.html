<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page paint under the notch/home indicator;
         the safe-area padding in index.css keeps content clear of them. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Hexagon + chevron, echoing the in-app rank insignia. Kept bold and
         high-contrast so it survives being rendered at 16px. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><path d=%22M50 4 L91 27 L91 73 L50 96 L9 73 L9 27 Z%22 fill=%22%23d9a441%22/><path d=%22M28 62 L50 44 L72 62%22 fill=%22none%22 stroke=%22%231b1917%22 stroke-width=%2211%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></svg>"
    />
    <meta name="theme-color" content="#141310" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Drillhall" />
    <meta
      name="description"
      content="Drillhall — a self-hosted CompTIA exam prep platform with flashcards, performance-based questions, timed mock exams, and honest readiness scoring."
    />
    <title>Drillhall</title>
    <!-- Applies the saved theme before first paint. Inline and synchronous on
         purpose: deferring this to React means a flash of the wrong theme on
         every load, which is far more jarring than a few bytes here. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("dh:theme");
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
