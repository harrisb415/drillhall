# Optional — the verified deploy path is pm2/systemd (DEPLOY.md).
services:
  app:
    build: .
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      NODE_ENV: production
    volumes:
      - ./data:/app/apps/server/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
